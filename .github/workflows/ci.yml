name: VoltGrid CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: TypeScript & Code Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Verify Server TypeScript Compilation
        run: |
          cd server
          npm ci
          npx tsc --noEmit

      - name: Run Automated Unit & Security Tests
        run: |
          cd server
          npm test

      - name: Verify Client TypeScript Compilation & Production Build
        run: |
          cd client
          npm ci
          npx tsc --noEmit
          npm run build

  docker-build-check:
    name: Docker Container Compilation & Health
    runs-on: ubuntu-latest
    needs: typecheck-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Container Stack
        run: |
          docker compose build
