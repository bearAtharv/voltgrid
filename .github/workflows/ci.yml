name: VoltGrid CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: TypeScript & Code Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Workspace Dependencies
        run: npm install

      - name: Typecheck & Build Server
        run: npm run build --workspace=server

      - name: Run Automated Unit & Security Tests
        run: npm run test --workspace=server

      - name: Typecheck Client
        run: npm run typecheck --workspace=client

      - name: Build Client Bundle
        run: npm run build --workspace=client

  docker-build-check:
    name: Docker Container Compilation & Health
    runs-on: ubuntu-latest
    needs: typecheck-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Container Stack
        run: |
          docker compose build
